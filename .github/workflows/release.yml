# Builds macOS (arm64 + Intel) and Windows installers.
# Distribution is manual: publish the draft Release, then send users the installer.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HKSDPCL Studio ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your computer.

            **Windows:** run the installer, then open HKSDPCL Studio from the Start menu or desktop shortcut. Version 0.2.3 and newer should show a window. If an older build does nothing when opened, install this version instead.

            **macOS:** the unsigned build will look “damaged”. That is Gatekeeper, not a broken file. Drag the app to Applications, then run:

            `xattr -cr "/Applications/HKSDPCL Studio.app"`

            Use the Apple Silicon DMG on M-series Macs, or the Intel DMG on Intel Macs.
          releaseDraft: true
          args: ${{ matrix.args }}
