[package]
name = "hksdpcl-studio"
version = "0.2.4"
description = "HKSDPCL Studio — Instagram content agent for Hong Kong Survival and Disaster Prevention Council"
authors = ["Hong Kong Survival and Disaster Prevention Council"]
edition = "2021"

[lib]
name = "hksdpcl_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

